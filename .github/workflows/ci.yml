name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest python/tests -q

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/leak-scan.sh

  conformance-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The corpus runners live in `cargo test` and `pytest python/tests`; this fails once the
      # vendored corpus is more than 30 days behind, so conformance/sync.sh gets run again.
      - run: |
          committed=$(sed -n 2p conformance/SOURCE_COMMIT)
          age=$(( ($(date +%s) - $(date -d "$committed" +%s)) / 86400 ))
          echo "corpus $(head -1 conformance/SOURCE_COMMIT) from $committed, $age days old"
          test "$age" -le 30
