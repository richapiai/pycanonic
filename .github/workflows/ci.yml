name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest python/tests bench/test_payloads.py -q

  bench:
    # Non-blocking: timing is noisy on shared GitHub runners. The blocking run is on the bench box
    # before a release (bench/README.md). There is no linux-x86_64 baseline yet, so this checks the
    # self-test and prints the table; once one is recorded, add --gate to the `bench/run.py` step.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin -r bench/requirements.txt
      - run: .venv/bin/maturin develop --release
      - run: .venv/bin/python bench/run.py --selftest
      - run: .venv/bin/python bench/run.py
      # Reported, never gated: pycanonic against the Python mapping libraries on the 501-field payload.
      - run: .venv/bin/python bench/interpreters.py

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/leak-scan.sh

  conformance-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The corpus runners live in `cargo test` and `pytest python/tests`; this fails once the
      # last conformance/sync.sh run (line 3 of SOURCE_COMMIT) is more than 30 days old.
      - run: |
          synced=$(sed -n 3p conformance/SOURCE_COMMIT)
          age=$(( ($(date +%s) - $(date -d "$synced" +%s)) / 86400 ))
          echo "corpus $(head -1 conformance/SOURCE_COMMIT) synced $synced, $age days ago"
          test "$age" -le 30
