name: release

# A v* tag builds the wheels and the sdist, installs each wheel in a clean venv and runs the README
# quick start, then attaches the wheels and the sdist to a GitHub release. PyPI (trusted publishing)
# and crates.io run only when the repository variable PUBLISH_PUBLIC is "true".
# A tag push also runs the full CI suite (ci.yml), and the release and publish jobs wait for it.
# The nightly schedule runs cargo audit and the fuzz targets only.
#
# Bench: the blocking gate is not here. Shared runners are too noisy to gate on timing. Before you
# push a tag, run `bench/run.py --gate` and `bench/run.py --vs-ts ../canonic` on the Hetzner bench
# box and keep the output (CONTRIBUTING.md, "Releasing").

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  fuzz:
    timeout-minutes: 45
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        target: [extract, stream, map_bytes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # libFuzzer needs nightly. Nothing else in CI uses it.
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - working-directory: crates/canonic-core
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/canonic-core/fuzz/artifacts/

  # The full CI suite (ci.yml) on the tagged commit. The release and both publish jobs need it.
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  version:
    timeout-minutes: 5
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # A tag on a branch that is not in main does not release.
      - run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The tag, the extension crate, canonic-core and __version__ must name the same version.
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/pycanonic-ext/Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/canonic-core/Cargo.toml | head -1)
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/pycanonic/__init__.py)
          echo "tag $tag, pycanonic-ext $ext, canonic-core $core, __version__ $py"
          test "$tag" = "$ext" && test "$tag" = "$core" && test "$tag" = "$py"

  wheels:
    timeout-minutes: 60
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: manylinux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - name: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: macos-universal2
            os: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
          - name: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # pyo3's abi3-py310 feature makes every wheel cp310-abi3: one wheel per platform.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    timeout-minutes: 15
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke:
    timeout-minutes: 20
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        # wheel and python are the axes. Each include entry names its wheel, so it only adds
        # os (and alpine) to that wheel's jobs.
        wheel: [manylinux-x86_64, manylinux-aarch64, musllinux-x86_64, macos-universal2, windows-x86_64]
        python: ["3.10", "3.14"]
        include:
          - wheel: manylinux-x86_64
            os: ubuntu-latest
            alpine: false
          # Native arm64 runner: the aarch64 wheel runs as built, no QEMU.
          - wheel: manylinux-aarch64
            os: ubuntu-24.04-arm
            alpine: false
          - wheel: musllinux-x86_64
            os: ubuntu-latest
            alpine: true
          # Runs the arm64 half of the universal2 wheel. The x86_64 half is built, not run.
          - wheel: macos-universal2
            os: macos-latest
            alpine: false
          - wheel: windows-x86_64
            os: windows-latest
            alpine: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist
      # The first ```python block of the README is the quick start.
      - run: |
          mkdir -p smoke
          awk '/^```python/{f=1;next} /^```/{if(f)exit} f' README.md > smoke/quickstart.py
          test -s smoke/quickstart.py
          cp dist/*.whl smoke/
      - if: ${{ !matrix.alpine }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - if: ${{ !matrix.alpine }}
        working-directory: smoke
        run: |
          python -m venv venv
          if [ -d venv/Scripts ]; then bin=venv/Scripts; else bin=venv/bin; fi
          "$bin/python" -m pip install --no-index --find-links . pycanonic
          "$bin/python" quickstart.py
          "$bin/canonic" --help
      - if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD/smoke:/smoke" -w /smoke "python:${{ matrix.python }}-alpine" sh -ec '
            python -m venv /venv
            /venv/bin/python -m pip install --no-index --find-links . pycanonic
            /venv/bin/python quickstart.py
            /venv/bin/canonic --help'

  github-release:
    timeout-minutes: 10
    needs: [test, audit, wheels, sdist, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # The notes are the CHANGELOG section of this version.
      - run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "pycanonic ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    timeout-minutes: 15
    if: vars.PUBLISH_PUBLIC == 'true'
    needs: [test, audit, wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates:
    timeout-minutes: 20
    if: vars.PUBLISH_PUBLIC == 'true'
    needs: pypi
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo publish -p canonic-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
