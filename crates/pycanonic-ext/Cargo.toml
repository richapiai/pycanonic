[package]
name = "pycanonic-ext"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["RichAPI AI (TexAu OÜ)"]
license = "MIT"
description = "Compile JSON mapping specs into plans that map provider responses to a canonical schema. The pycanonic Python extension."
repository = "https://github.com/richapiai/pycanonic"
homepage = "https://github.com/richapiai/pycanonic"
keywords = ["json", "mapping", "schema", "normalization", "etl"]
categories = ["parser-implementations", "encoding"]
readme = "../../README.md"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
# extension-module leaves libpython unlinked, so a Rust test binary may not link; Python tests cover this crate.
test = false
doctest = false

[dependencies]
canonic-core = { path = "../canonic-core" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
self_cell = "1.3.0"
