[package]
name = "pycanonic-ext"
version = "0.1.0"
edition = "2024"
authors = ["RichAPI AI (TexAu OÜ)"]
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]
# extension-module leaves libpython unlinked, so a Rust test binary may not link; Python tests cover this crate.
test = false
doctest = false

[dependencies]
canonic-core = { path = "../canonic-core" }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
