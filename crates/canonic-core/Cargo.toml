[package]
name = "canonic-core"
version = "0.1.0"
edition = "2024"
authors = ["RichAPI AI (TexAu OÜ)"]
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
proptest = "1.12.0"
