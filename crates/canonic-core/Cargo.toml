[package]
name = "canonic-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["RichAPI AI (TexAu OÜ)"]
license = "MIT"
description = "Compile JSON mapping specs into plans that map provider responses to a canonical schema. The core of pycanonic."
repository = "https://github.com/richapiai/pycanonic"
homepage = "https://github.com/richapiai/pycanonic"
keywords = ["json", "mapping", "schema", "normalization", "etl"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
divan = "0.1.21"
jsonschema = { version = "0.59.0", default-features = false }
proptest = "1.12.0"

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "hot"
harness = false

[[bench]]
name = "wide"
harness = false
